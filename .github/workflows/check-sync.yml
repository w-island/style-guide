name: 스타일가이드 동기화 검사

on:
  push:
    paths:
      - 'index.html'
      - 'plugins/**/references/*.md'
      - 'scripts/check-sync.mjs'
  pull_request:
  workflow_dispatch:

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-sync.mjs
