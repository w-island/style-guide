name: 스타일가이드 동기화 검사

on:
  push:
    paths:
      - 'index.html'
      - 'plugins/**/*.md'
      - 'plugins/**/plugin.json'
      - 'wisland-design-system.md'
      - 'scripts/*.mjs'
      - '.claude-plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
  pull_request:
  workflow_dispatch:

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 가이드 사이트 ↔ 스킬 문서 대조
        run: node scripts/check-sync.mjs
      - name: 외부 AI용 통합본이 최신인지 확인
        run: node scripts/build-bundle.mjs --check
      - name: Claude ↔ Codex 매니페스트 대조
        run: node scripts/check-manifests.mjs
